<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - UniTutor</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand"><a href="../index.html"><h1>UniTutor</h1></a></div>
            <ul class="nav-menu">
                <li><span id="user-name">Welcome, Tutor</span></li>
                <li><a href="#" onclick="Auth.logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>Tutor Panel</h2></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="modules.html">My Modules</a>
                <a href="slots.html">Available Slots</a>
                <a href="bookings.html">Bookings</a>
                <a href="sessions.html">Sessions</a>
                <a href="feedback.html">Feedback</a>
                <a href="profile.html" class="active">Profile</a>
                <a href="#" onclick="Auth.logout()" class="logout">Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="page-header"><h1>My Profile</h1><p>View and update your profile information</p></div>
            <div id="alert-container"></div>

            <div class="card">
                <div class="card-header"><h2>Profile Information</h2></div>
                <div class="card-body">
                    <form id="profile-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="first_name">First Name</label>
                                <input type="text" id="first_name" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="last_name">Last Name</label>
                                <input type="text" id="last_name" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="tutor_id">Tutor ID</label>
                            <input type="text" id="tutor_id" class="form-control" disabled>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Profile</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><h2>Change Password</h2></div>
                <div class="card-body">
                    <form id="password-form">
                        <div class="form-group">
                            <label for="current_password">Current Password</label>
                            <input type="password" id="current_password" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="new_password">New Password</label>
                            <input type="password" id="new_password" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="confirm_password">Confirm New Password</label>
                            <input type="password" id="confirm_password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-warning">Change Password</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/database.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        if (!Auth.requireAuth('tutor')) window.location.href = '../login.html';

        document.addEventListener('DOMContentLoaded', function() {
            const user = Auth.getCurrentUser();
            document.getElementById('user-name').textContent = `Welcome, ${user.name}`;
            loadProfile();
        });

        function loadProfile() {
            const user = Auth.getCurrentUser();
            document.getElementById('first_name').value = user.data.TutorName;
            document.getElementById('last_name').value = user.data.TutorSurname;
            document.getElementById('tutor_id').value = user.data.TutorID || 'N/A';
            document.getElementById('email').value = user.data.TutorEmail;
        }

        document.getElementById('profile-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const data = {
                TutorName: document.getElementById('first_name').value,
                TutorSurname: document.getElementById('last_name').value,
                TutorEmail: document.getElementById('email').value
            };

            const result = Auth.updateProfile(data);
            
            if (result.success) {
                showAlert('Profile updated successfully!', 'success');
                document.getElementById('user-name').textContent = `Welcome, ${result.name}`;
                loadProfile();
            } else {
                showAlert(result.message, 'danger');
            }
        });

        document.getElementById('password-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const currentPassword = document.getElementById('current_password').value;
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (newPassword !== confirmPassword) {
                showAlert('New passwords do not match', 'danger');
                return;
            }

            if (newPassword.length < 6) {
                showAlert('Password must be at least 6 characters', 'danger');
                return;
            }

            const result = Auth.changePassword(currentPassword, newPassword);
            
            if (result.success) {
                showAlert('Password changed successfully!', 'success');
                document.getElementById('password-form').reset();
            } else {
                showAlert(result.message, 'danger');
            }
        });

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alert-container');
            alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => { alertContainer.innerHTML = ''; }, 3000);
        }
    </script>
</body>
</html>
