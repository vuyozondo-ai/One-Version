<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration - UniTutor</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html">
                    <h1>UniTutor</h1>
                </a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </div>
    </nav>

    <!-- Register Section -->
    <section>
        <div class="container">
            <div class="section-header">
                <h2>Admin Registration</h2>
                <p>Create your admin account to manage the system</p>
            </div>
            <div style="max-width: 500px; margin: 0 auto;">
                <div class="card">
                    <div id="alert-container"></div>
                    <form id="register-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="first_name">First Name</label>
                                <input type="text" id="first_name" class="form-control" required placeholder="Enter first name">
                            </div>
                            <div class="form-group">
                                <label for="last_name">Last Name</label>
                                <input type="text" id="last_name" class="form-control" required placeholder="Enter last name">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" class="form-control" required placeholder="Enter username">
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" class="form-control" required placeholder="Enter your email">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" class="form-control" required placeholder="Enter phone number">
                        </div>
                        <div class="form-group">
                            <label for="role">Admin Role</label>
                            <select id="role" class="form-control" required>
                                <option value="">Select role</option>
                                <option value="Admin">Admin</option>
                                <option value="Super Admin">Super Admin</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" id="password" class="form-control" required placeholder="Create password">
                            </div>
                            <div class="form-group">
                                <label for="confirm_password">Confirm Password</label>
                                <input type="password" id="confirm_password" class="form-control" required placeholder="Confirm password">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Register</button>
                    </form>
                    <div style="margin-top: 1rem; text-align: center;">
                        <p>Already have an account? <a href="login.html">Login here</a></p>
                        <p>Register as a <a href="register.html">Student</a> or <a href="register-tutor.html">Tutor</a></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 UniTutor - University Peer Tutoring Management System</p>
        </div>
    </footer>

    <script src="assets/js/database.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const first_name = document.getElementById('first_name').value;
            const last_name = document.getElementById('last_name').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const role = document.getElementById('role').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            const alertContainer = document.getElementById('alert-container');
            
            // Validate passwords match
            if (password !== confirm_password) {
                alertContainer.innerHTML = '<div class="alert alert-danger">Passwords do not match</div>';
                return;
            }
            
            // Validate password length
            if (password.length < 6) {
                alertContainer.innerHTML = '<div class="alert alert-danger">Password must be at least 6 characters</div>';
                return;
            }
            
            // Attempt registration
            const result = Auth.registerAdmin({
                AdminName: first_name,
                AdminSurname: last_name,
                AdminUsername: username,
                AdminEmail: email,
                AdminContactNumber: phone,
                AdminRole: role,
                password: password
            });
            
            if (result.success) {
                alertContainer.innerHTML = '<div class="alert alert-success">Registration successful! Redirecting to dashboard...</div>';
                setTimeout(() => {
                    Auth.redirectBasedOnRole();
                }, 1500);
            } else {
                alertContainer.innerHTML = '<div class="alert alert-danger">' + result.message + '</div>';
            }
        });

        // Redirect if already logged in
        if (Auth.isAuthenticated()) {
            Auth.redirectBasedOnRole();
        }
    </script>
</body>
</html>
