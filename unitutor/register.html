<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - UniTutor</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html">
                    <h1>UniTutor</h1>
                </a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </div>
    </nav>

    <!-- Register Section -->
    <section>
        <div class="container">
            <div class="section-header">
                <h2>Student Registration</h2>
                <p>Create your student account to get started</p>
            </div>
            <div style="max-width: 500px; margin: 0 auto;">
                <div class="card">
                    <div id="alert-container"></div>
                    <form id="register-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="first_name">First Name</label>
                                <input type="text" id="first_name" class="form-control" required placeholder="Enter first name">
                            </div>
                            <div class="form-group">
                                <label for="last_name">Last Name</label>
                                <input type="text" id="last_name" class="form-control" required placeholder="Enter last name">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="student_number">Student Number</label>
                            <input type="text" id="student_number" class="form-control" required placeholder="e.g., STU0001">
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" class="form-control" required placeholder="Enter your email">
                        </div>
                        <div class="form-group">
                            <label for="program_id">Program</label>
                            <select id="program_id" class="form-control" required>
                                <option value="">Select your program</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="password">Password</label>
                                <input type="password" id="password" class="form-control" required placeholder="Create password">
                            </div>
                            <div class="form-group">
                                <label for="confirm_password">Confirm Password</label>
                                <input type="password" id="confirm_password" class="form-control" required placeholder="Confirm password">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Register</button>
                    </form>
                    <div style="margin-top: 1rem; text-align: center;">
                        <p>Already have an account? <a href="login.html">Login here</a></p>
                        <p>Register as a <a href="register-tutor.html">Tutor</a> or <a href="register-admin.html">Admin</a></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 UniTutor - University Peer Tutoring Management System</p>
        </div>
    </footer>

    <script src="assets/js/database.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        // Load programs on page load
        document.addEventListener('DOMContentLoaded', function() {
            const programs = DB.getAll('Program');
            const select = document.getElementById('program_id');
            
            programs.forEach(program => {
                const option = document.createElement('option');
                option.value = program.ProgrammeID;
                option.textContent = program.ProgrammeName;
                select.appendChild(option);
            });
        });

        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const first_name = document.getElementById('first_name').value;
            const last_name = document.getElementById('last_name').value;
            const student_number = document.getElementById('student_number').value;
            const email = document.getElementById('email').value;
            const program_id = document.getElementById('program_id').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            const alertContainer = document.getElementById('alert-container');
            
            // Validate passwords match
            if (password !== confirm_password) {
                alertContainer.innerHTML = '<div class="alert alert-danger">Passwords do not match</div>';
                return;
            }
            
            // Validate password length
            if (password.length < 6) {
                alertContainer.innerHTML = '<div class="alert alert-danger">Password must be at least 6 characters</div>';
                return;
            }
            
            // Attempt registration
            const result = Auth.registerStudent({
                StudentName: first_name,
                StudentSurname: last_name,
                StudentNumber: student_number,
                StudentEmail: email,
                StudentContactNumber: '',
                StudentYearOfStudy: 1,
                password: password,
                ProgrammeID: program_id
            });
            
            if (result.success) {
                alertContainer.innerHTML = '<div class="alert alert-success">Registration successful! Redirecting to dashboard...</div>';
                setTimeout(() => {
                    Auth.redirectBasedOnRole();
                }, 1500);
            } else {
                alertContainer.innerHTML = '<div class="alert alert-danger">' + result.message + '</div>';
            }
        });

        // Redirect if already logged in
        if (Auth.isAuthenticated()) {
            Auth.redirectBasedOnRole();
        }
    </script>
</body>
</html>
