<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Sessions - UniTutor</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand"><a href="../index.html"><h1>UniTutor</h1></a></div>
            <ul class="nav-menu">
                <li><span id="user-name">Welcome, Student</span></li>
                <li><a href="#" onclick="Auth.logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header"><h2>Student Panel</h2></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="find_tutor.html">Find Tutor</a>
                <a href="bookings.html">My Bookings</a>
                <a href="sessions.html" class="active">My Sessions</a>
                <a href="feedback.html">My Feedback</a>
                <a href="profile.html">Profile</a>
                <a href="#" onclick="Auth.logout()" class="logout">Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="page-header"><h1>My Sessions</h1><p>View your upcoming and completed tutoring sessions</p></div>
            <div id="alert-container"></div>

            <div class="card">
                <div class="card-body">
                    <div class="filter-bar">
                        <div class="filter-group">
                            <label>Status</label>
                            <select id="filter-status" class="form-control">
                                <option value="">All Statuses</option>
                                <option value="Scheduled">Scheduled</option>
                                <option value="Completed">Completed</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>
                        <button onclick="filterSessions()" class="btn btn-primary">Filter</button>
                        <button onclick="loadSessions()" class="btn btn-secondary">Reset</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><h2>All Sessions</h2></div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table id="sessions-table">
                            <thead>
                                <tr>
                                    <th>Tutorial ID</th>
                                    <th>Tutor</th>
                                    <th>Module</th>
                                    <th>Date</th>
                                    <th>Time</th>
                                    <th>Mode</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/database.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        if (!Auth.requireAuth('student')) window.location.href = '../login.html';

        document.addEventListener('DOMContentLoaded', function() {
            const user = Auth.getCurrentUser();
            document.getElementById('user-name').textContent = `Welcome, ${user.name}`;
            loadSessions();
        });

        function loadSessions() {
            const user = Auth.getCurrentUser();
            const bookings = DB.getAll('Booking').filter(b => b.StudentID === user.id);
            const tutorials = DB.getAll('Tutorial').filter(s => bookings.some(b => b.BookingID === s.BookingID));
            const tutors = DB.getAll('Tutor');
            const modules = DB.getAll('Module');
            const tbody = document.querySelector('#sessions-table tbody');
            tbody.innerHTML = '';

            tutorials.forEach(tutorial => {
                const booking = bookings.find(b => b.BookingID === tutorial.BookingID);
                const tutor = tutors.find(t => t.TutorID === booking.TutorID);
                const module = modules.find(m => m.ModuleCode === booking.ModuleCode);
                const statusClass = tutorial.TutorialStatus === 'Completed' ? 'badge-success' : 
                                   tutorial.TutorialStatus === 'Cancelled' ? 'badge-danger' : 'badge-info';
                const hasFeedback = DB.getAll('Feedback').some(f => f.BookingID === tutorial.BookingID && f.StudentID === user.id);

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${tutorial.TutorialID}</td>
                    <td>${tutor ? tutor.TutorName + ' ' + tutor.TutorSurname : 'N/A'}</td>
                    <td>${module ? module.ModuleName : 'N/A'}</td>
                    <td>${tutorial.TutorialDate}</td>
                    <td>${tutorial.TutorialStartTime} - ${tutorial.TutorialEndTime}</td>
                    <td>${tutorial.TutorialMode}</td>
                    <td><span class="badge ${statusClass}">${tutorial.TutorialStatus}</span></td>
                    <td>
                        ${tutorial.TutorialStatus === 'Completed' && !hasFeedback ? 
                            `<a href="feedback.html?booking_id=${tutorial.BookingID}" class="btn btn-sm btn-primary">Give Feedback</a>` : 
                            hasFeedback ? '<span class="badge badge-success">Feedback Given</span>' : '-'}
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function filterSessions() {
            const user = Auth.getCurrentUser();
            const status = document.getElementById('filter-status').value;
            const bookings = DB.getAll('Booking').filter(b => b.StudentID === user.id);
            let tutorials = DB.getAll('Tutorial').filter(s => bookings.some(b => b.BookingID === s.BookingID));
            
            if (status) {
                tutorials = tutorials.filter(s => s.TutorialStatus === status);
            }

            const tutors = DB.getAll('Tutor');
            const modules = DB.getAll('Module');
            const tbody = document.querySelector('#sessions-table tbody');
            tbody.innerHTML = '';

            tutorials.forEach(tutorial => {
                const booking = bookings.find(b => b.BookingID === tutorial.BookingID);
                const tutor = tutors.find(t => t.TutorID === booking.TutorID);
                const module = modules.find(m => m.ModuleCode === booking.ModuleCode);
                const statusClass = tutorial.TutorialStatus === 'Completed' ? 'badge-success' : 
                                   tutorial.TutorialStatus === 'Cancelled' ? 'badge-danger' : 'badge-info';
                const hasFeedback = DB.getAll('Feedback').some(f => f.BookingID === tutorial.BookingID && f.StudentID === user.id);

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${tutorial.TutorialID}</td>
                    <td>${tutor ? tutor.TutorName + ' ' + tutor.TutorSurname : 'N/A'}</td>
                    <td>${module ? module.ModuleName : 'N/A'}</td>
                    <td>${tutorial.TutorialDate}</td>
                    <td>${tutorial.TutorialStartTime} - ${tutorial.TutorialEndTime}</td>
                    <td>${tutorial.TutorialMode}</td>
                    <td><span class="badge ${statusClass}">${tutorial.TutorialStatus}</span></td>
                    <td>
                        ${tutorial.TutorialStatus === 'Completed' && !hasFeedback ? 
                            `<a href="feedback.html?booking_id=${tutorial.BookingID}" class="btn btn-sm btn-primary">Give Feedback</a>` : 
                            hasFeedback ? '<span class="badge badge-success">Feedback Given</span>' : '-'}
                    </td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
